name: CI (pull requests)

# Deploys now run on AWS: CodePipeline -> CodeBuild -> CodeDeploy -> Lambda
# (see aws/SETUP.md and buildspec.yml). This workflow only provides PR checks
# and the coverage comment, which AWS CodePipeline can't post to GitHub PRs.
# Delete this file if you want zero GitHub Actions usage.

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pull-requests: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        run: |
          if ! command -v node >/dev/null 2>&1; then
            brew install node
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: "./coverage/coverage-summary.json"
          json-final-path: "./coverage/coverage-final.json"

      - name: Build app
        run: npm run build
