<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Distributed API Rate Limiter</title>
  <desc id="desc">Many clients send requests through an API. The API checks one shared, Redis-backed rate limiter, which either allows each request or rejects it.</desc>
  <defs>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7BA05B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A6741"/>
    </marker>
    <marker id="arrow-maple" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C77B58"/>
    </marker>
  </defs>

  <!-- The card shows only the top 192px of this image, and at its widest (a one-column card, ~720px) that is the
       top ~215 units of the viewBox. So the whole drawing sits between y=30 and y=190, and the cream fills the
       rest, which keeps the image at least 1.33:1 so it still fills the 192px area on a 320px-wide phone. -->
  <rect width="800" height="600" fill="#FFF8F0"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">

    <!-- Clients -->
    <g fill="#7BA05B" fill-opacity="0.22" stroke="#7BA05B" stroke-width="3">
      <rect x="20" y="32" width="84" height="34" rx="10"/>
      <rect x="20" y="72" width="84" height="34" rx="10"/>
      <rect x="20" y="112" width="84" height="34" rx="10"/>
    </g>
    <g fill="#4A6741">
      <circle cx="62" cy="43" r="6"/><path d="M49 61 a13 11 0 0 1 26 0 z"/>
      <circle cx="62" cy="83" r="6"/><path d="M49 101 a13 11 0 0 1 26 0 z"/>
      <circle cx="62" cy="123" r="6"/><path d="M49 141 a13 11 0 0 1 26 0 z"/>
    </g>
    <text x="62" y="178" fill="#2C2416">Clients</text>

    <!-- Requests converge on the API -->
    <g fill="none" stroke="#7BA05B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M108 49 L174 77" marker-end="url(#arrow-sage)"/>
      <path d="M108 89 L174 89" marker-end="url(#arrow-sage)"/>
      <path d="M108 129 L174 101" marker-end="url(#arrow-sage)"/>
    </g>

    <!-- API -->
    <rect x="180" y="51" width="100" height="76" rx="16" fill="#4A6741"/>
    <text x="230" y="101" fill="#FFF8F0" font-size="34" font-weight="700">API</text>

    <!-- API checks the limiter -->
    <path d="M284 89 H320" fill="none" stroke="#4A6741" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)"/>

    <!-- Shared limiter -->
    <rect x="326" y="51" width="200" height="76" rx="16" fill="#7BA05B"/>
    <text x="426" y="83" fill="#2C2416">Shared</text>
    <text x="426" y="113" fill="#2C2416">rate limiter</text>

    <!-- Redis behind the limiter -->
    <path d="M426 131 V146" fill="none" stroke="#4A6741" stroke-width="4" stroke-linecap="round"/>
    <path d="M394 150 V176 a32 9 0 0 0 64 0 V150 z" fill="#4A6741"/>
    <ellipse cx="426" cy="150" rx="32" ry="9" fill="#4A6741" stroke="#FFF8F0" stroke-width="3"/>
    <text x="466" y="172" text-anchor="start" fill="#2C2416">Redis</text>

    <!-- Allowed -->
    <path d="M530 77 H588 V62 H640" fill="none" stroke="#4A6741" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
    <rect x="646" y="40" width="136" height="44" rx="22" fill="#7BA05B" fill-opacity="0.22" stroke="#4A6741" stroke-width="3"/>
    <text x="714" y="72" fill="#2C2416">Allowed</text>

    <!-- Rejected -->
    <path d="M530 101 H588 V116 H640" fill="none" stroke="#C77B58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10" marker-end="url(#arrow-maple)"/>
    <rect x="646" y="94" width="136" height="44" rx="22" fill="#C77B58" fill-opacity="0.18" stroke="#C77B58" stroke-width="3"/>
    <text x="714" y="126" fill="#2C2416">Rejected</text>
  </g>
</svg>
